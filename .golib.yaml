schema_version: 1
tool_version: v2.5.1
tool_checksums_sha256: ca1293ba633e3ebb5197134cd586979db4e0af51a37e0de0bad2884005327c15
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/log-v2.txt
operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["./handler/async"]
        run: '^Test(CanceledFlushDoesNotWaitForBlockedSubmission|ShutdownHonorsCallerCancellationAcrossHeldFallback)$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: otel-boundary
        timeout: 5m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["./handler/redact"]
        fuzz: '^FuzzNestedAttributes$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["./handler/redact"]
        fuzz: '^FuzzRedactionRules$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
